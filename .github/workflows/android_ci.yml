name: Android CI

on:
  push:
    branches: [ "main", "develop", "feat/counseling" ]
  pull_request:
    branches: [ "main", "develop" ] # 검사할 브랜치

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Ktlint # 코딩 컨벤션 검사
        run: ./gradlew ktlintCheck

      - name: Run Unit Tests # 테스트 코드 실행
        run: ./gradlew testDebugUnitTest